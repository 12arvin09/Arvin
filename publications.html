<!DOCTYPE html>
<html>
    <head>
        <title>Arvin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="trial3-styles-header.css"/>

        <style>
            html { scroll-behavior: smooth; }

            :root{
                --color-accent: rgb(244, 244, 142);
                --color-cyan: rgb(14, 205, 219);
                --color-navy: rgb(14, 54, 68);
            }

            html, body { margin: 0; overflow-x: hidden; }

            /* Ambient tech-grid backdrop — same as the rest of the site */
            body{
                background-image:
                    radial-gradient(ellipse 900px 600px at 12% 8%, rgba(14, 205, 219, 0.14), transparent 60%),
                    radial-gradient(ellipse 900px 600px at 88% 30%, rgba(244, 244, 142, 0.09), transparent 60%),
                    radial-gradient(ellipse 900px 700px at 30% 85%, rgba(64, 132, 255, 0.12), transparent 60%),
                    linear-gradient(rgba(14, 205, 219, 0.07) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(14, 205, 219, 0.07) 1px, transparent 1px);
                background-size: auto, auto, auto, 48px 48px, 48px 48px;
                background-attachment: fixed;
                background-repeat: no-repeat, no-repeat, no-repeat, repeat, repeat;
            }

            .page-title{
                margin: 40px auto 0;
                text-align: center;
            }

            .page-title h1{
                position: relative;
                display: inline-block;
                margin: 0;
                font-family: "Raleway", sans-serif;
                font-weight: 700;
                font-size: clamp(1.6rem, 4vw, 2.6rem);
                letter-spacing: 0.5px;
                color: var(--color-accent);
                text-shadow: 0 0 22px rgba(14, 205, 219, 0.35);
            }

            .page-title h1::after{
                content: '';
                display: block;
                width: 72px;
                height: 4px;
                margin: 14px auto 0;
                border-radius: 3px;
                background: linear-gradient(90deg, var(--color-cyan), var(--color-accent));
            }

            .page-title p{
                margin: 18px auto 0;
                max-width: 620px;
                padding: 0 24px;
                font-family: "Raleway", sans-serif;
                font-size: clamp(0.9rem, 1.6vw, 1.05rem);
                line-height: 1.6;
                color: rgba(255, 255, 255, 0.7);
            }

            .container{
                display: flex;
                flex-direction: row;
                gap: 36px;
                justify-content: center;
                flex-wrap: wrap;
                max-width: 1180px;
                margin: 0 auto;
                padding: 60px 24px 90px;
            }

            .project-preview{
                display: flex;
                flex-direction: column;
                width: 100%;
                max-width: 320px;

                padding: 14px;
                border: 1px solid rgba(14, 205, 219, 0.2);
                border-radius: 20px;
                background: linear-gradient(160deg, rgba(14, 54, 68, 0.4), rgba(3, 12, 17, 0.55));
                box-shadow: 0 18px 50px -22px rgba(0, 0, 0, 0.8), 0 6px 26px rgba(14, 205, 219, 0.1);
                text-align: center;
                transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
            }

            .project-preview:hover{
                transform: translateY(-6px);
                border-color: rgba(14, 205, 219, 0.5);
                box-shadow: 0 26px 60px -20px rgba(0, 0, 0, 0.85), 0 10px 40px rgba(14, 205, 219, 0.24);
            }

            .project-preview-photo-container{
                width: 100%;
                aspect-ratio: 3 / 4;
                cursor: pointer;
                border-radius: 14px;
                overflow: hidden;
            }

            .project-preview-photo{
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: opacity 0.3s ease, transform 0.4s ease;
                border-radius: 14px;
                opacity: 0.85;
            }

            .project-preview:hover .project-preview-photo{
                opacity: 1;
                transform: scale(1.04);
            }

            .project-preview-caption{
                font-family: "Raleway", sans-serif;
                color: rgba(244, 244, 142, 0.9);
                line-height: 1.5;
                text-decoration-line: none;
            }

            .project-preview-caption p{
                margin: 16px 6px 6px;
                font-weight: 600;
                letter-spacing: 0.3px;
                text-shadow: 0 0 14px rgba(14, 205, 219, 0.25);
            }

            .project-preview a{
                text-decoration: none;
                color: inherit;
            }

            @media (max-width: 1200px)  {
                .container{
                    gap: 32px;
                    padding: 44px 20px 70px;
                }
            }
        </style>

    </head>
    <body  style="background-color:rgb(0, 0, 0);
            min-height: 100vh;
            padding-top: 100px;
            margin:0;
    ">
        <div class="header">
            <div class="name">
                <p class="name-edit">Arvin Munkh-Ochir's Hub</p>
            </div>
           
            <div class="hamburger">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            
            <div class="links-right">
                <a href="index.html"><button class="home">HOME</button></a>
                <a href="publications.html"><button class="home">PUBLICATIONS</button></a>
                
            </div>        
        </div>

        <div class="page-title">
            <h1>Publications &amp; Reports</h1>
            <p>Full write-ups of my engineering projects. Tap a card to open the report.</p>
        </div>

        <div class="container">
            <div class="project-preview">
                <a href="Brain-Computer Interface-Report.pdf" target="_blank">
                    <div class="project-preview-photo-container">
                        <img class="project-preview-photo" src="image/bci.jpg">
                    </div>
                    <div class="project-preview-caption">
                        <p>Spelling Letters Through Brain Waves</p>
                    </div>
                </a>
            </div>

            <div class="project-preview">
                <a href="Cane-Report.pdf" target="_blank">
                    <div class="project-preview-photo-container">
                        <img class="project-preview-photo" src="image/cane.jpg">
                    </div>
                    <div class="project-preview-caption">
                        <p>Smart Cane For Visually Impaired People</p>
                    </div>
                </a>   
            </div>

            <div class="project-preview">
                <a href="Smart-Backpack-Report.pdf" target="_blank">
                    <div class="project-preview-photo-container">
                        <img class="project-preview-photo" src="image/backpack.jpg">
                    </div>
                    <div class="project-preview-caption">
                        <p>Location Sensing Smart Backpack</p>
                    </div>
                </a>   
            </div>
        </div>
    </body>
    <script src="navigation.js"></script>
    
</html>
