<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Arvin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="trial3-styles-header.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <style>
            html {
                scroll-behavior: smooth;
            }

            * {
                box-sizing: border-box;
            }

            .news-page-header{
                font-family: "Raleway", sans-serif;
                color: rgb(244, 244, 142);
                font-size: clamp(1.6rem, 4vw, 2.6rem);
                text-align: center;
                margin: 0 0 40px 0;
                letter-spacing: 1px;
            }

            .news-page-list{
                max-width: 800px;
                margin: 0 auto;
                padding: 0 20px 80px;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .news-page-item{
                display: flex;
                gap: 20px;
                text-decoration: none;
                background: rgba(14, 54, 68, 0.35);
                border: 1px solid rgba(244, 244, 142, 0.15);
                border-radius: 12px;
                padding: 18px;
                box-shadow: 0 6px 30px rgba(14,205,219,0.08);
                transition: 0.3s ease;
            }

            .news-page-item:hover{
                border-color: rgba(14, 205, 219, 0.5);
                background: rgba(14, 205, 219, 0.08);
                transform: translateY(-3px);
            }

            .news-page-item-image{
                width: 160px;
                height: 120px;
                object-fit: cover;
                border-radius: 8px;
                flex-shrink: 0;
            }

            .news-page-item-body{
                display: flex;
                flex-direction: column;
                justify-content: center;
                min-width: 0;
            }

            .news-page-date{
                font-family: "Raleway", sans-serif;
                color: rgba(14, 205, 219, 0.85);
                font-size: 12px;
                letter-spacing: 1px;
                text-transform: uppercase;
                margin-bottom: 6px;
            }

            .news-page-title{
                font-family: "Raleway", sans-serif;
                color: rgb(244, 244, 142);
                font-size: clamp(1rem, 2vw, 1.2rem);
                font-weight: 600;
                margin-bottom: 6px;
            }

            .news-page-excerpt{
                font-family: "Raleway", sans-serif;
                color: rgba(255, 255, 255, 0.75);
                font-size: 13.5px;
                line-height: 1.5;
            }

            @media (max-width: 600px) {
                .news-page-item{
                    flex-direction: column;
                }

                .news-page-item-image{
                    width: 100%;
                    height: 160px;
                }
            }
        </style>
    </head>
    <body style="background-color:rgb(0, 0, 0);
                min-height: 100vh;
                padding-top: 140px;
                margin:0;
                ">
        <div class="full-homepage">
            <div class="header">
                <div class="name">
                    <p class="name-edit">Arvin Munkh-Ochir's Hub</p>
                </div>

                <div class="hamburger">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>


                <div class="links-right">
                    <a href="index.html"><button class="home">HOME</button></a>
                    <a href="publications.html"><button class="home">PUBLICATIONS</button></a>

                </div>
            </div>

            <p class="news-page-header">All News</p>

            <div class="news-page-list">
                <a class="news-page-item" href="news-1.html">
                    <img class="news-page-item-image" src="image/arvin-profile.PNG" alt="News entry image">
                    <div class="news-page-item-body">
                        <span class="news-page-date">Placeholder</span>
                        <span class="news-page-title">Went to AI Summer School in SUNY Korea</span>
                        <span class="news-page-excerpt">Tell Claude what's been happening lately and this entry will be rewritten with the real story.</span>
                    </div>
                </a>
            </div>
        </div>
    </body>
    <script src="navigation.js"></script>
</html>
